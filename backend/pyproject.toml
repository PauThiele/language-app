[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "korean-graded-reader-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0", "sqlalchemy>=2.0,<3.0", "alembic>=1.14,<2.0", "pydantic>=2.9,<3.0", "pydantic-settings>=2.6,<3.0", "PyJWT>=2.9,<3.0", "pwdlib[argon2]>=0.2,<1.0", "email-validator>=2.2,<3.0", "httpx>=0.27,<1.0", "python-multipart>=0.0.12,<1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0", "httpx>=0.27,<1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
