services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: graded_reader
      POSTGRES_USER: graded_reader
      POSTGRES_PASSWORD: graded_reader_dev_only
    ports:
      - "5432:5432"
    volumes:
      - graded_reader_postgres:/var/lib/postgresql/data

volumes:
  graded_reader_postgres:
